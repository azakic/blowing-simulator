name: Build and Push image

on:
  push:
    branches: [ master ]
    # Samo izmene koje utiču na image. Dokumentacija i sam workflow ne
    # pokreću build — za ručni test koristi workflow_dispatch.
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
  workflow_dispatch:

# Novi push na istu granu prekida prethodni build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Klaster je arm64 (OCI A1.Flex), pa image mora biti linux/arm64.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/arm64
        push: true
        tags: |
          ghcr.io/azakic/blowing-simulator:latest
          ghcr.io/azakic/blowing-simulator:${{ github.sha }}
        cache-from: type=gha,scope=blowing-simulator
        cache-to: type=gha,mode=max,scope=blowing-simulator
