# Tajne se čitaju iz `.env` (van Gita) — nikad nisu u ovom fajlu.
# `:?` znači da compose puca sa jasnom greškom ako promenljiva nije postavljena.
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: blowing_simulator
      POSTGRES_USER: blowing
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: blowing
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_NAME: blowing_simulator
      PORT: 8080
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
volumes:
  pgdata:
