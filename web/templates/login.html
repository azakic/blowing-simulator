<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Wolken-ASM Reports</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    body { font-family: system-ui, sans-serif; background:#0b1220; color:#e6edf3; }
    .container { max-width: 420px; margin: 6rem auto; background:#111a2b; padding: 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    h1 { font-size: 1.25rem; margin: 0 0 1rem; }
    label { display:block; font-size: .9rem; margin:.75rem 0 .25rem; color:#9fb3c8; }
    input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #26324a; background:#0b1220; color:#e6edf3; }
    input:focus { outline: 2px solid #2a72f7; border-color:#2a72f7; }
    .btn { margin-top: 1rem; width:100%; padding:10px 12px; background:#2a72f7; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:600; }
    .btn:hover { background:#1f5dd0; }
    .sub { color:#9fb3c8; font-size:.85rem; margin-top: .5rem; text-align:center; }
    a { color:#7bb0ff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sign in</h1>
    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{.Next}}" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />

      <button class="btn" type="submit">Login</button>
    </form>
    <p class="sub">Default admin: admin@example.com / admin123!</p>
  </div>
</body>
</html>
